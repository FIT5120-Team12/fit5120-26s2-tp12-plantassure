# ============================================================
# Local 开发环境配置
# ============================================================
# 默认通过 application.yml 中 SPRING_PROFILES_ACTIVE=local 启用。

spring:
  datasource:
    # MySQL 8 JDBC Driver。
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 本地默认连接 localhost:3306/plantky。
    # 如果团队成员数据库地址不同，可设置 DB_URL，无需修改 Git 中的配置文件。
    url: ${DB_URL:jdbc:mysql://localhost:3306/plantky?useUnicode=true&characterEncoding=utf8&serverTimezone=Australia/Melbourne&useSSL=false&allowPublicKeyRetrieval=true}

    # 本地默认 root；推荐通过环境变量覆盖。
    username: ${DB_USERNAME:root}

    # 默认空密码只是为了兼容本地环境，不要在生产环境这样配置。
    password: ${DB_PASSWORD:123456}

    # Spring Boot 默认使用 HikariCP 连接池。
    hikari:
      # 最大数据库连接数。Iteration 1 流量小，10 已经足够。
      maximum-pool-size: 10
      # 连接池保持的最小空闲连接数。
      minimum-idle: 2
      # 获取连接最长等待 30 秒。
      connection-timeout: 30000
      # 连接有效性检查最长等待 5 秒。
      validation-timeout: 5000

logging:
  level:
    # 第三方框架维持 INFO，避免日志过多。
    root: INFO
    # 本地开发时 Plantky 自己的代码使用 DEBUG，便于排查。
    com.plantky: DEBUG
