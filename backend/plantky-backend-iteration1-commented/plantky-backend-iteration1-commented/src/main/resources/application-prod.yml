# ============================================================
# Production 环境配置
# ============================================================
# 启动时设置：SPRING_PROFILES_ACTIVE=prod
# 生产数据库账号、密码、URL 不应写死在代码仓库中，全部通过环境变量注入。

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 生产环境必须显式提供以下三个环境变量。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      # 允许部署平台通过环境变量微调连接池；如果不提供则使用默认值。
      maximum-pool-size: ${DB_MAX_POOL_SIZE:15}
      minimum-idle: ${DB_MIN_IDLE:3}
      connection-timeout: 30000
      validation-timeout: 5000

logging:
  level:
    # 生产环境减少 DEBUG 日志，避免噪音和不必要的信息输出。
    root: INFO
    com.plantky: INFO

plantky:
  cors:
    # 生产环境前端域名必须显式注入，例如 https://plantky.example.com。
    allowed-origins:
      - ${FRONTEND_ORIGIN}
