# ============================================================
# PlantAssure Iteration 2 公共配置
# ============================================================
# application.yml 会在所有环境加载。
# environment-specific 配置放在 application-local.yml / application-prod.yml。

server:
  # 后端 HTTP 端口。
  # 如果环境变量 SERVER_PORT 不存在，则使用默认 8080。
  port: ${SERVER_PORT:8080}

spring:
  application:
    # Spring Application 名称，日志/监控/未来部署时可用于识别服务。
    name: plantky-backend

  profiles:
    # 默认使用 local 环境。
    # 生产部署时设置 SPRING_PROFILES_ACTIVE=prod。
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    # API Contract 需要明确返回 null 字段（例如 commonName/rating），
    # 因此设置 always，不自动忽略 null。
    default-property-inclusion: always

  servlet:
    multipart:
      # Epic 1 后端要求最大 10 MB 图片；request 略放宽以容纳 multipart headers。
      max-file-size: 10MB
      max-request-size: 11MB

mybatis-plus:
  configuration:
    # 数据库 snake_case 自动映射到 Java camelCase：
    # scientific_name -> scientificName
    # vba100_record_count -> vba100RecordCount
    # ala_most_recent_date -> alaMostRecentDate
    map-underscore-to-camel-case: true

    # 当前项目不使用 MyBatis 二级缓存。
    # 数据量很小、查询简单，避免为了“使用缓存”而引入额外一致性复杂度。
    cache-enabled: false

  global-config:
    # 关闭 MyBatis-Plus 启动 banner，保持启动日志简洁。
    banner: false

springdoc:
  api-docs:
    # OpenAPI JSON 地址；Apifox 可直接通过该 URL 导入接口。
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 页面地址。
    path: /swagger-ui.html

plantky:
  cors:
    # 本地默认允许 Vite dev server 访问。
    # 可通过 FRONTEND_ORIGIN 环境变量覆盖。
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}

  # ==========================================================
  # Epic 1 — AI-assisted plant identification
  # ==========================================================
  identification:
    # AI 团队接口未部署时保持 false，此时 /identify 返回 503，但 Search/Assessment 不受影响。
    enabled: ${PLANT_IDENTIFICATION_ENABLED:false}
    base-url: ${PLANT_IDENTIFICATION_BASE_URL:http://localhost:8000}
    endpoint: ${PLANT_IDENTIFICATION_ENDPOINT:/identify}
    api-key: ${PLANT_IDENTIFICATION_API_KEY:}
    max-image-size-mb: 10
    top-candidates: ${PLANT_IDENTIFICATION_TOP_CANDIDATES:3}
    # 需求文档没有规定阈值；默认不额外过滤。AI 团队确认阈值后通过环境变量设置。
    minimum-confidence: ${PLANT_IDENTIFICATION_MIN_CONFIDENCE:0.0}
    connect-timeout: ${PLANT_IDENTIFICATION_CONNECT_TIMEOUT:3s}
    read-timeout: ${PLANT_IDENTIFICATION_READ_TIMEOUT:15s}
